            rows.push({
                date: dateISO,
                client: client ? client.name : clientId,
                market: client ? client.market : "",
                status: rec.status,
                reason: rec.reason || "",
                notes: rec.notes || "",
                time: rec.timestamp ? rec.timestamp.slice(11, 16) : "",
                gps: rec.gps || null,
                order: rec.order || null,
                payment: rec.payment || null,
